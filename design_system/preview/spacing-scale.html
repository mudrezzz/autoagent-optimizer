<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Spacing scale</title>
<link rel="stylesheet" href="_card.css" />
<style>
  .scale { display: flex; flex-direction: column; gap: 8px; }
  .step { display: grid; grid-template-columns: 80px 1fr 70px; align-items: center; gap: 16px; }
  .bar { background: var(--accent); height: 12px; border-radius: 2px; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--gray-500); }
  .px { font-family: var(--font-mono); font-size: 11px; color: var(--gray-400); text-align: right; }
</style>
</head>
<body>
<div class="card tight">
  <div class="label-small" style="margin-bottom:12px">Spacing · 4 px base</div>
  <div class="scale">
    <div class="step"><div class="meta">space-1</div><div><div class="bar" style="width:4px"></div></div><div class="px">4 px</div></div>
    <div class="step"><div class="meta">space-2</div><div><div class="bar" style="width:8px"></div></div><div class="px">8 px</div></div>
    <div class="step"><div class="meta">space-3</div><div><div class="bar" style="width:12px"></div></div><div class="px">12 px</div></div>
    <div class="step"><div class="meta">space-4</div><div><div class="bar" style="width:16px"></div></div><div class="px">16 px</div></div>
    <div class="step"><div class="meta">space-6</div><div><div class="bar" style="width:24px"></div></div><div class="px">24 px</div></div>
    <div class="step"><div class="meta">space-8</div><div><div class="bar" style="width:32px"></div></div><div class="px">32 px</div></div>
    <div class="step"><div class="meta">space-12</div><div><div class="bar" style="width:48px"></div></div><div class="px">48 px</div></div>
    <div class="step"><div class="meta">space-16</div><div><div class="bar" style="width:64px"></div></div><div class="px">64 px</div></div>
    <div class="step"><div class="meta">space-20</div><div><div class="bar" style="width:80px"></div></div><div class="px">80 px</div></div>
    <div class="step"><div class="meta">space-24</div><div><div class="bar" style="width:96px"></div></div><div class="px">96 px</div></div>
  </div>
</div>
</body>
</html>
