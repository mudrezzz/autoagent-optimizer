<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Brand · Indigo</title>
<link rel="stylesheet" href="_card.css" />
<style>
  .ramp { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; }
  .chip {
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 0 0 1px var(--border-muted);
    background: var(--gray-0);
  }
  .chip .sw { height: 64px; display: block; }
  .chip .meta { padding: 8px 10px 10px; }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--gray-800); font-weight: 500; }
  .hex { font-family: var(--font-mono); font-size: 10px; color: var(--gray-400); margin-top: 2px; }
  .accent {
    margin-top: 18px;
    background: var(--accent-bg);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
    border: 1px solid var(--indigo-100);
  }
  .dot { width: 8px; height: 8px; background: var(--accent); border-radius: 999px; }
  .accent-text { font-size: 13px; color: var(--indigo-700); }
  .accent-text b { font-weight: 600; }
</style>
</head>
<body>
<div class="card tight">
  <div class="label-small" style="margin-bottom:12px">Indigo · primary brand color</div>
  <div class="ramp">
    <div class="chip"><div class="sw" style="background:#EEF0FF"></div><div class="meta"><div class="name">50</div><div class="hex">#EEF0FF</div></div></div>
    <div class="chip"><div class="sw" style="background:#DDE0FF"></div><div class="meta"><div class="name">100</div><div class="hex">#DDE0FF</div></div></div>
    <div class="chip"><div class="sw" style="background:#C2C7FF"></div><div class="meta"><div class="name">200</div><div class="hex">#C2C7FF</div></div></div>
    <div class="chip"><div class="sw" style="background:#9BA1FA"></div><div class="meta"><div class="name">300</div><div class="hex">#9BA1FA</div></div></div>
    <div class="chip"><div class="sw" style="background:#7C7AF0"></div><div class="meta"><div class="name">400</div><div class="hex">#7C7AF0</div></div></div>
    <div class="chip"><div class="sw" style="background:#635BFF"></div><div class="meta"><div class="name">500</div><div class="hex">#635BFF</div></div></div>
    <div class="chip"><div class="sw" style="background:#5048E5"></div><div class="meta"><div class="name">600</div><div class="hex">#5048E5</div></div></div>
    <div class="chip"><div class="sw" style="background:#3F38B8"></div><div class="meta"><div class="name">700</div><div class="hex">#3F38B8</div></div></div>
  </div>
  <div class="accent">
    <span class="dot"></span>
    <span class="accent-text"><b>indigo-500</b> · primary action · links · champion · focus rings. <b>Solid only — never gradients.</b></span>
  </div>
</div>
</body>
</html>
