<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Tagline</title>
<link rel="stylesheet" href="_card.css" />
<style>
  .stage { display: flex; flex-direction: column; gap: 20px; }
  .tag {
    font-size: 38px;
    line-height: 1.12;
    letter-spacing: -0.025em;
    font-weight: 600;
    color: var(--fg);
    margin: 0;
  }
  .tag span { color: var(--accent); }
  .sub {
    font-size: 15px;
    line-height: 1.55;
    color: var(--gray-600);
    max-width: 560px;
    margin: 0;
  }
</style>
</head>
<body>
<div class="card">
  <div class="stage">
    <h1 class="tag">Compound AI systems,<br/>designed and measured <span>with evidence.</span></h1>
    <p class="sub">AutoAgent Optimizer designs many candidate architectures, measures them as white boxes, and returns a deployable champion you can ship today.</p>
  </div>
</div>
</body>
</html>
