<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>UI text — Geist</title>
<link rel="stylesheet" href="_card.css" />
<style>
  .row {
    display: grid;
    grid-template-columns: 100px 1fr;
    align-items: baseline;
    gap: 20px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border-muted);
  }
  .row:last-child { border-bottom: none; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--gray-400); }
</style>
</head>
<body>
<div class="card tight">
  <div class="label-small" style="margin-bottom:8px">UI text · Geist</div>
  <div class="row"><div class="meta">600 · 17/1.3</div><div style="font-size:17px;font-weight:600;letter-spacing:-0.015em">Promote to champion</div></div>
  <div class="row"><div class="meta">500 · 15/1.4</div><div style="font-size:15px;font-weight:500">Compare architectures</div></div>
  <div class="row"><div class="meta">400 · 14/1.55</div><div style="font-size:14px;color:var(--gray-700)">The retriever accounts for 62 % of p95 latency. Consider moving arithmetic into a dedicated tool.</div></div>
  <div class="row"><div class="meta">400 · 12/1.5</div><div style="font-size:12px;color:var(--gray-500)">Secondary metadata · helper text · table captions.</div></div>
</div>
</body>
</html>
