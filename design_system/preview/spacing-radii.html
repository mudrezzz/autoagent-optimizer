<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Radii</title>
<link rel="stylesheet" href="_card.css" />
<style>
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; }
  .box { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .sq {
    width: 72px; height: 72px;
    background: var(--gray-50);
    box-shadow: 0 0 0 1px var(--border);
  }
  .pill { width: 96px; height: 32px; background: var(--accent-bg); box-shadow: 0 0 0 1px var(--indigo-100); }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--gray-800); font-weight: 500; }
  .hint { font-family: var(--font-mono); font-size: 10px; color: var(--gray-400); text-align: center; }
</style>
</head>
<body>
<div class="card tight">
  <div class="label-small" style="margin-bottom:14px">Radii · medium SaaS</div>
  <div class="grid">
    <div class="box"><div class="sq" style="border-radius:4px"></div><div class="name">xs</div><div class="hint">4 · chips</div></div>
    <div class="box"><div class="sq" style="border-radius:6px"></div><div class="name">sm</div><div class="hint">6 · inputs</div></div>
    <div class="box"><div class="sq" style="border-radius:8px"></div><div class="name">md</div><div class="hint">8 · buttons</div></div>
    <div class="box"><div class="sq" style="border-radius:10px"></div><div class="name">lg</div><div class="hint">10 · cards</div></div>
    <div class="box"><div class="sq" style="border-radius:12px"></div><div class="name">xl</div><div class="hint">12 · panels</div></div>
    <div class="box"><div class="sq" style="border-radius:16px"></div><div class="name">2xl</div><div class="hint">16 · hero</div></div>
    <div class="box"><div class="pill" style="border-radius:999px;margin-top:20px"></div><div class="name">full</div><div class="hint">999 · pills</div></div>
  </div>
</div>
</body>
</html>
