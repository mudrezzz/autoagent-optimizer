<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Cards</title>
<link rel="stylesheet" href="_card.css" />
<style>
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .c {
    background: var(--gray-0);
    border-radius: 12px;
    padding: 18px 20px;
    display: flex; flex-direction: column; gap: 10px;
    box-shadow: var(--shadow-card);
  }
  .c.champion { box-shadow: 0 0 0 2px var(--accent), var(--shadow-md); }
  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .title { font-size: 15px; font-weight: 600; color: var(--gray-900); }
  .id { font-family: var(--font-mono); font-size: 11px; color: var(--gray-400); margin-top: 2px; }
  .row { display: flex; gap: 18px; margin-top: 4px; }
  .metric { display: flex; flex-direction: column; gap: 1px; }
  .m-val { font-family: var(--font-mono); font-size: 18px; color: var(--gray-900); font-weight: 600; letter-spacing: -0.01em; }
  .m-lbl { font-size: 10px; color: var(--gray-500); }
  .footer { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
  .pill {
    font-size: 11px; font-weight: 500;
    padding: 3px 9px; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .pill .d { width: 5px; height: 5px; border-radius: 999px; }
  .pill.champ { background: var(--accent-bg); color: var(--indigo-700); }
  .pill.champ .d { background: var(--accent); }
  .pill.base { background: var(--gray-100); color: var(--gray-600); }
  .pill.base .d { background: var(--gray-400); }
  .delta { font-family: var(--font-mono); font-size: 11px; font-weight: 500; padding: 2px 7px; border-radius: 5px; }
  .delta.pos { background: var(--green-50); color: var(--green-700); }
</style>
</head>
<body>
<div class="card tight">
  <div class="label-small" style="margin-bottom:12px">Architecture cards · soft shadow · indigo ring for champion</div>
  <div class="grid">
    <div class="c champion">
      <div class="head">
        <div><div class="title">RAG · rerank · HyDE</div><div class="id">arch_b4f.compound</div></div>
        <span class="pill champ"><span class="d"></span>Champion</span>
      </div>
      <div class="row">
        <div class="metric"><span class="m-val">0.842</span><span class="m-lbl">f1@k</span></div>
        <div class="metric"><span class="m-val">$0.31</span><span class="m-lbl">cost</span></div>
        <div class="metric"><span class="m-val">1.24s</span><span class="m-lbl">p95</span></div>
      </div>
      <div class="footer"><span class="delta pos">+4.2 f1</span><span class="delta pos">−38 % cost</span></div>
    </div>
    <div class="c">
      <div class="head">
        <div><div class="title">RAG · single-shot</div><div class="id">arch_001.compound</div></div>
        <span class="pill base"><span class="d"></span>Baseline</span>
      </div>
      <div class="row">
        <div class="metric"><span class="m-val">0.804</span><span class="m-lbl">f1@k</span></div>
        <div class="metric"><span class="m-val">$0.49</span><span class="m-lbl">cost</span></div>
        <div class="metric"><span class="m-val">0.92s</span><span class="m-lbl">p95</span></div>
      </div>
      <div class="footer"><span style="font-size:11px;color:var(--gray-500)">reference architecture</span></div>
    </div>
  </div>
</div>
</body>
</html>
