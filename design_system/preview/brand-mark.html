<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Brand mark</title>
<link rel="stylesheet" href="_card.css" />
<style>
  .stage {
    display: grid;
    grid-template-columns: 180px 1fr;
    align-items: center;
    gap: 32px;
  }
  .mark-tile {
    width: 160px; height: 160px;
    background: var(--gray-50);
    border-radius: 16px;
    display: grid; place-items: center;
  }
  .mark-tile img { width: 100px; height: 100px; }
  .right { display: flex; flex-direction: column; gap: 18px; }
  .right img { display: block; height: 36px; width: auto; }
  .meta { color: var(--fg-muted); font-size: 12px; line-height: 1.55; }
</style>
</head>
<body>
<div class="card">
  <div class="stage">
    <div class="mark-tile"><img src="../assets/logo-mark.svg" alt="AutoAgent Optimizer mark" /></div>
    <div class="right">
      <img src="../assets/logo-lockup.svg" alt="AutoAgent Optimizer" />
      <div class="meta">
        Compound network glyph — three nodes, champion on top. Solid indigo tile.<br/>
        Clear-space ≥ 12 px · min size 24 px mark / 120 px lockup
      </div>
    </div>
  </div>
</div>
</body>
</html>
