<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Buttons</title>
<link rel="stylesheet" href="_card.css" />
<style>
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .col-label { font-size: 11px; font-weight: 500; color: var(--gray-500); letter-spacing: 0.02em; text-transform: uppercase; }

  .btn {
    font-family: var(--font-sans);
    font-weight: 500;
    font-size: 14px;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid transparent;
    background: var(--gray-900); color: white;
    cursor: pointer; text-align: center;
    transition: all 140ms ease;
    line-height: 1.2;
  }
  .btn.primary { background: var(--accent); color: white; box-shadow: 0 1px 0 rgba(255,255,255,0.18) inset, 0 1px 2px rgba(10,10,15,0.08); }
  .btn.primary.hover { background: var(--accent-hover); }
  .btn.secondary { background: var(--gray-0); color: var(--gray-900); border-color: var(--border); box-shadow: var(--shadow-xs); }
  .btn.secondary.hover { background: var(--gray-50); border-color: var(--border-strong); }
  .btn.ghost { background: transparent; color: var(--gray-700); border-color: transparent; }
  .btn.ghost.hover { background: var(--gray-100); color: var(--gray-900); }
  .btn.destructive { background: var(--gray-0); color: var(--error); border-color: var(--border); box-shadow: var(--shadow-xs); }
  .btn.destructive.hover { background: var(--red-50); border-color: var(--red-500); }
  .btn.focus { box-shadow: var(--focus-ring); }
  .btn.disabled { opacity: 0.45; pointer-events: none; }
</style>
</head>
<body>
<div class="card tight">
  <div class="label-small" style="margin-bottom:14px">Buttons · 4 states</div>
  <div class="grid">
    <div class="col">
      <div class="col-label">Primary</div>
      <button class="btn primary">Start a run</button>
      <button class="btn primary hover">Start a run</button>
      <button class="btn primary focus">Start a run</button>
      <button class="btn primary disabled">Start a run</button>
    </div>
    <div class="col">
      <div class="col-label">Secondary</div>
      <button class="btn secondary">Cancel</button>
      <button class="btn secondary hover">Cancel</button>
      <button class="btn secondary focus">Cancel</button>
      <button class="btn secondary disabled">Cancel</button>
    </div>
    <div class="col">
      <div class="col-label">Ghost</div>
      <button class="btn ghost">View trace</button>
      <button class="btn ghost hover">View trace</button>
      <button class="btn ghost focus">View trace</button>
      <button class="btn ghost disabled">View trace</button>
    </div>
    <div class="col">
      <div class="col-label">Destructive</div>
      <button class="btn destructive">Delete</button>
      <button class="btn destructive hover">Delete</button>
      <button class="btn destructive focus">Delete</button>
      <button class="btn destructive disabled">Delete</button>
    </div>
  </div>
</div>
</body>
</html>
