<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Display sample</title>
<link rel="stylesheet" href="_card.css" />
<style>
  .display {
    font-size: 60px;
    line-height: 1.02;
    letter-spacing: -0.035em;
    font-weight: 600;
    color: var(--fg);
    margin: 0;
  }
  .display span { color: var(--accent); }
  .below { margin-top: 16px; font-size: 13px; color: var(--gray-500); font-family: var(--font-mono); }
</style>
</head>
<body>
<div class="card">
  <p class="display">Find the right<br/>balance. <span>Prove it.</span></p>
  <div class="below">Geist · 600 · 60 px · −0.035em · line-height 1.02</div>
</div>
</body>
</html>
