<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AutoAgent Optimizer — workbench</title>
<link rel="icon" href="../../assets/favicon.svg" />
<link rel="stylesheet" href="../../colors_and_type.css" />
<style>
  /* ============================================================
     Workbench — soft, airy, indigo-accented SaaS app
     ============================================================ */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--gray-50);
    color: var(--fg);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; }
  a { color: inherit; text-decoration: none; cursor: pointer; }
  code, .mono { font-family: var(--font-mono); }
  .muted { color: var(--gray-500); }

  .kbd {
    display: inline-block;
    font-family: var(--font-mono); font-size: 11px;
    color: var(--gray-600);
    background: var(--gray-0);
    border: 1px solid var(--border);
    border-bottom-width: 1.5px;
    border-radius: 4px;
    padding: 1px 5px;
  }

  /* ============================================================
     App shell
     ============================================================ */
  .app {
    display: grid;
    grid-template-columns: 264px 1fr;
    height: 100vh;
    background: var(--gray-50);
  }

  /* ============================================================
     Sidebar
     ============================================================ */
  .app-sidebar {
    background: var(--gray-0);
    border-right: 1px solid var(--border-muted);
    display: flex; flex-direction: column;
    height: 100vh; overflow-y: auto;
  }
  .app-sidebar-brand {
    padding: 18px 20px 18px;
  }
  .app-sidebar-brand img { height: 24px; display: block; }

  .app-sidebar-section { padding: 8px 12px 4px; }
  .app-side-label {
    font-size: 11px; font-weight: 500;
    color: var(--gray-500);
    padding: 8px 8px 6px;
    letter-spacing: 0.02em;
  }
  .app-side-pick {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px;
    background: var(--gray-50);
    border: 1px solid var(--border-muted);
    border-radius: 8px;
    font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all 140ms ease;
  }
  .app-side-pick:hover { background: var(--gray-100); border-color: var(--border); }
  .app-side-pick svg { width: 14px; height: 14px; color: var(--gray-400); margin-left: auto; }
  .ws-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 999px; }

  .app-side-nav {
    display: flex; flex-direction: column; gap: 1px;
    padding: 10px 12px;
  }
  .app-side-nav a {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px;
    border-radius: 7px;
    font-size: 13px; font-weight: 500;
    color: var(--gray-700);
    transition: all 120ms ease;
  }
  .app-side-nav a:hover { background: var(--gray-100); color: var(--gray-900); }
  .app-side-nav a.active {
    background: var(--accent-bg);
    color: var(--indigo-700);
  }
  .app-side-nav a.active svg { color: var(--accent); }
  .app-side-nav a svg { width: 16px; height: 16px; stroke-width: 1.7; color: var(--gray-500); flex-shrink: 0; }
  .app-side-nav .n {
    margin-left: auto;
    font-size: 11px; font-weight: 500;
    color: var(--gray-500);
    background: var(--gray-100);
    padding: 1px 7px;
    border-radius: 999px;
  }
  .app-side-nav .n-warn { background: var(--amber-50); color: var(--amber-700); }
  .app-side-nav a.active .n { background: rgba(99,91,255,0.18); color: var(--indigo-700); }

  /* recent runs */
  .app-runs { display: flex; flex-direction: column; gap: 1px; padding: 0 4px; }
  .app-run-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px;
    border-radius: 7px;
    cursor: pointer;
    transition: background 120ms ease;
  }
  .app-run-row:hover { background: var(--gray-100); }
  .app-run-row.active { background: var(--accent-bg); }
  .run-led {
    width: 6px; height: 6px; border-radius: 999px; flex-shrink: 0;
    background: var(--gray-300);
  }
  .run-led.champion { background: var(--accent); box-shadow: 0 0 0 3px rgba(99,91,255,0.18); }
  .run-led.running  { background: var(--blue-500); animation: pulse 1.4s ease-in-out infinite; }
  .run-led.failed   { background: var(--red-500); }
  .run-led.idle     { background: var(--gray-300); }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.9); } }

  .run-text { flex: 1; min-width: 0; }
  .run-name { font-size: 13px; color: var(--gray-900); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
  .run-meta { font-family: var(--font-mono); font-size: 10px; color: var(--gray-400); margin-top: 1px; }
  .run-trophy { width: 14px; height: 14px; color: var(--accent); }

  .app-sidebar-foot {
    margin-top: auto;
    padding: 12px;
    border-top: 1px solid var(--border-muted);
  }
  .app-side-user {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 8px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 120ms ease;
  }
  .app-side-user:hover { background: var(--gray-100); }
  .avatar {
    width: 30px; height: 30px;
    background: var(--accent); color: white;
    border-radius: 8px;
    font-size: 12px; font-weight: 600;
    display: grid; place-items: center;
  }
  .user-name { font-size: 13px; font-weight: 500; color: var(--gray-900); }
  .user-org { font-size: 11px; color: var(--gray-500); }
  .app-side-user svg { margin-left: auto; width: 14px; height: 14px; color: var(--gray-400); }

  /* ============================================================
     Main column
     ============================================================ */
  .app-main {
    display: grid;
    grid-template-rows: 60px 1fr;
    height: 100vh;
    overflow: hidden;
  }

  .app-topbar {
    display: grid;
    grid-template-columns: 1fr 1.4fr 1fr;
    align-items: center;
    padding: 0 24px;
    background: var(--gray-0);
    border-bottom: 1px solid var(--border-muted);
    gap: 24px;
  }
  .tb-left { display: flex; align-items: center; gap: 8px; }
  .tb-crumb { font-size: 13px; color: var(--gray-500); font-weight: 500; }
  .tb-sep { color: var(--gray-300); }
  .tb-id { font-size: 13px; color: var(--gray-900); font-weight: 600; }
  .tb-pill {
    font-size: 11px; font-weight: 500;
    padding: 3px 8px;
    background: var(--accent-bg);
    color: var(--indigo-700);
    border-radius: 6px;
    margin-left: 8px;
  }

  .tb-budget {
    display: grid; grid-template-columns: auto 1fr auto;
    align-items: center; gap: 12px;
  }
  .tb-budget-label {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 500; color: var(--gray-600);
  }
  .tb-budget-label svg { width: 14px; height: 14px; color: var(--gray-500); }
  .tb-budget-bar {
    height: 6px; background: var(--gray-150);
    border-radius: 999px; overflow: hidden;
  }
  .tb-budget-fill {
    height: 100%; background: var(--accent);
    border-radius: 999px;
  }
  .tb-budget-vals {
    display: flex; align-items: baseline; gap: 6px;
    font-size: 12px; font-weight: 500;
  }
  .tb-budget-vals .muted { font-size: 11px; color: var(--gray-500); font-weight: 400; }

  .tb-right { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .tb-search {
    display: flex; align-items: center; gap: 8px;
    background: var(--gray-50); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 10px; font-size: 12px; color: var(--gray-500);
    min-width: 220px;
    transition: all 140ms ease;
  }
  .tb-search:hover { background: var(--gray-100); border-color: var(--border-strong); }
  .tb-search svg { width: 14px; height: 14px; }
  .tb-search .kbd { margin-left: auto; }

  .tb-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 500;
    padding: 7px 12px; border-radius: 8px;
    border: 1px solid transparent;
    transition: all 140ms ease;
  }
  .tb-btn svg { width: 14px; height: 14px; }
  .tb-btn-ghost { background: var(--gray-0); color: var(--gray-800); border-color: var(--border); box-shadow: var(--shadow-xs); }
  .tb-btn-ghost:hover { background: var(--gray-50); border-color: var(--border-strong); }
  .tb-btn-primary {
    background: var(--accent); color: white;
    box-shadow: 0 1px 0 rgba(255,255,255,0.18) inset, 0 1px 2px rgba(99,91,255,0.32);
  }
  .tb-btn-primary:hover { background: var(--accent-hover); }

  /* ============================================================
     Content area
     ============================================================ */
  .app-content {
    display: grid;
    grid-template-columns: 1fr 340px;
    overflow: hidden;
    background: var(--gray-50);
  }
  .app-center {
    overflow-y: auto;
    padding: 28px 32px 64px;
    display: flex; flex-direction: column; gap: 20px;
  }

  .content-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }
  .ch-title {
    font-size: 26px; font-weight: 600;
    color: var(--gray-900); margin: 0;
    letter-spacing: -0.025em;
  }
  .ch-title span { color: var(--gray-500); font-weight: 500; }
  .ch-sub { font-size: 13px; color: var(--gray-500); margin: 4px 0 0; }
  .ch-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .ch-pill {
    font-size: 12px; font-weight: 500;
    padding: 5px 12px;
    background: var(--accent-bg); color: var(--indigo-700);
    border-radius: 999px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .ch-pill .dot { width: 6px; height: 6px; background: var(--accent); border-radius: 999px; }

  /* metric strip */
  .metric-strip {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--border-muted);
    border-radius: 12px;
    border: 1px solid var(--border-muted);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  .ms-cell {
    background: var(--gray-0);
    padding: 16px 18px;
    display: flex; flex-direction: column; gap: 4px;
    position: relative;
    min-height: 110px;
    overflow: hidden;
  }
  .ms-lbl { font-size: 11px; color: var(--gray-500); font-weight: 500; }
  .ms-row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .ms-val {
    font-family: var(--font-mono);
    font-size: 22px; font-weight: 600;
    color: var(--gray-900); letter-spacing: -0.015em;
    white-space: nowrap;
  }
  .ms-delta {
    font-family: var(--font-mono); font-size: 11px; font-weight: 500;
    padding: 2px 7px; border-radius: 5px;
  }
  .ms-delta.pos { background: var(--green-50); color: var(--green-700); }
  .ms-delta.neg { background: var(--red-50); color: var(--red-700); }
  .ms-cap { font-size: 11px; color: var(--gray-500); }
  .ms-spark { position: absolute; right: 14px; bottom: 12px; opacity: 0.6; width: 80px; }

  /* arch list */
  .arch-list {
    background: var(--gray-0);
    border-radius: 12px;
    border: 1px solid var(--border-muted);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  .arch-list-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border-muted);
  }
  .al-label { font-size: 13px; font-weight: 600; color: var(--gray-900); }
  .al-tools { display: flex; gap: 4px; }
  .al-tool {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 9px;
    font-size: 12px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    color: var(--gray-700);
    transition: all 120ms ease;
  }
  .al-tool:hover { background: var(--gray-100); }
  .al-tool svg { width: 12px; height: 12px; }

  .arch-row {
    display: grid;
    grid-template-columns: 110px 1.4fr 80px 80px 80px 110px;
    gap: 14px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border-muted);
    align-items: center;
    cursor: pointer;
    transition: background 120ms ease;
  }
  .arch-row:last-child { border-bottom: none; }
  .arch-row:hover { background: var(--gray-50); }
  .arch-row.active { background: var(--accent-bg); }
  .arch-row.status-champion {
    background: linear-gradient(to right, var(--accent-bg) 0%, var(--gray-0) 70%);
  }
  .arch-row.status-champion:hover, .arch-row.status-champion.active {
    background: linear-gradient(to right, var(--accent-bg) 0%, var(--gray-50) 80%);
  }
  .ar-id { font-size: 12px; color: var(--gray-500); }
  .ar-title { font-size: 14px; font-weight: 600; color: var(--gray-900); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ar-shape { font-size: 11px; color: var(--gray-400); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ar-met-val { font-family: var(--font-mono); font-size: 14px; color: var(--gray-900); font-weight: 600; }
  .ar-met-lbl { font-size: 10px; color: var(--gray-500); margin-top: 1px; }

  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 500;
    padding: 3px 9px; border-radius: 999px;
  }
  .pill .dot { width: 5px; height: 5px; border-radius: 999px; }
  .pill.p-baseline { background: var(--gray-100); color: var(--gray-600); }
  .pill.p-baseline .dot { background: var(--gray-400); }
  .pill.p-pass     { background: var(--green-50); color: var(--green-700); }
  .pill.p-pass .dot { background: var(--green-500); }
  .pill.p-warn     { background: var(--amber-50); color: var(--amber-700); }
  .pill.p-warn .dot { background: var(--amber-500); }
  .pill.p-fail     { background: var(--red-50); color: var(--red-700); }
  .pill.p-fail .dot { background: var(--red-500); }
  .pill.p-champion { background: var(--accent-bg); color: var(--indigo-700); }
  .pill.p-champion .dot { background: var(--accent); }

  /* trace view */
  .trace-view {
    background: var(--gray-0);
    border-radius: 12px;
    border: 1px solid var(--border-muted);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }
  .tv-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border-muted);
  }
  .tv-title { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--gray-900); font-weight: 600; }
  .tv-title svg { width: 14px; height: 14px; color: var(--accent); }
  .tv-arch { font-family: var(--font-mono); font-size: 12px; color: var(--gray-500); font-weight: 400; }
  .tv-case { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--gray-700); }
  .tv-step {
    width: 26px; height: 26px;
    background: var(--gray-50);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--gray-700);
    display: grid; place-items: center;
    transition: all 120ms ease;
  }
  .tv-step:hover { background: var(--gray-100); border-color: var(--border-strong); }
  .tv-step svg { width: 14px; height: 14px; }

  .tv-body { padding: 18px 20px; }
  .tv-rows { display: flex; flex-direction: column; gap: 8px; }
  .tv-row {
    display: grid; grid-template-columns: 140px 1fr 70px;
    gap: 14px; align-items: center;
    font-family: var(--font-mono); font-size: 11px;
  }
  .tv-label { color: var(--gray-700); }
  .tv-label.fail { color: var(--red-600); }
  .tv-track {
    position: relative; height: 18px;
    background: var(--gray-100);
    border-radius: 5px;
  }
  .tv-span { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
  .tv-span.k-retrieval { background: var(--blue-500); }
  .tv-span.k-llm { background: var(--accent); }
  .tv-span.k-tool { background: var(--amber-500); }
  .tv-span.k-hitl { background: var(--gray-400); }
  .tv-span.k-fail { background: var(--red-500); }
  .tv-ms { text-align: right; color: var(--gray-500); }
  .tv-axis {
    display: grid; grid-template-columns: 140px 1fr 70px;
    gap: 14px; margin-top: 14px; padding-top: 10px;
    border-top: 1px solid var(--border-muted);
  }
  .tv-ticks {
    display: flex; justify-content: space-between;
    font-family: var(--font-mono); font-size: 10px; color: var(--gray-400);
  }

  .tv-legend {
    display: flex; gap: 18px;
    padding: 12px 20px;
    border-top: 1px solid var(--border-muted);
    background: var(--gray-50);
    font-size: 11px; color: var(--gray-600);
  }
  .tv-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .lg-sw { width: 10px; height: 10px; border-radius: 3px; }
  .lg-sw.k-retrieval { background: var(--blue-500); }
  .lg-sw.k-llm { background: var(--accent); }
  .lg-sw.k-tool { background: var(--amber-500); }
  .lg-sw.k-hitl { background: var(--gray-400); }
  .lg-sw.k-fail { background: var(--red-500); }

  /* rail */
  .rail {
    background: var(--gray-0);
    border-left: 1px solid var(--border-muted);
    padding: 24px 20px;
    overflow-y: auto;
    display: flex; flex-direction: column; gap: 28px;
  }
  .rail-section { display: flex; flex-direction: column; gap: 12px; }
  .rail-label {
    font-size: 12px; font-weight: 600;
    color: var(--gray-900);
  }

  .rail-bottleneck {
    background: var(--red-50);
    border: 1px solid #FECACA;
    border-radius: 12px;
    padding: 14px 16px;
  }
  .rb-top {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 8px;
  }
  .rb-icon {
    width: 20px; height: 20px;
    background: var(--red-500);
    border-radius: 6px;
    color: white;
    display: grid; place-items: center;
  }
  .rb-icon svg { width: 12px; height: 12px; }
  .rb-id { font-size: 13px; color: var(--gray-900); font-weight: 600; font-family: var(--font-mono); }
  .rb-copy { font-size: 13px; line-height: 1.55; color: var(--gray-700); margin: 0 0 10px; }
  .rb-copy b { font-weight: 600; color: var(--gray-900); }
  .rb-evidence { font-size: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .rb-evidence .mono { color: var(--gray-500); }
  .rb-evidence a { color: var(--link); font-weight: 500; }
  .rb-evidence a:hover { text-decoration: underline; }

  .suggest { display: flex; flex-direction: column; gap: 10px; }
  .sg-row {
    background: var(--gray-0);
    border: 1px solid var(--border-muted);
    border-radius: 10px;
    padding: 12px 14px;
    display: grid; grid-template-columns: 1fr auto;
    gap: 10px;
    align-items: flex-start;
    transition: all 140ms ease;
  }
  .sg-row:hover { border-color: var(--border); box-shadow: var(--shadow-xs); }
  .sg-tag {
    font-size: 10px; font-weight: 600;
    padding: 2px 7px; border-radius: 4px;
    background: var(--gray-100); color: var(--gray-700);
    display: inline-block;
    margin-bottom: 6px;
  }
  .sg-row[data-tint="indigo"] .sg-tag { background: var(--accent-bg); color: var(--indigo-700); }
  .sg-row[data-tint="amber"]  .sg-tag { background: var(--amber-50); color: var(--amber-700); }
  .sg-row[data-tint="green"]  .sg-tag { background: var(--green-50); color: var(--green-700); }
  .sg-title { font-size: 13px; color: var(--gray-900); font-weight: 500; margin-bottom: 3px; }
  .sg-sub { font-size: 12px; color: var(--gray-600); line-height: 1.5; }
  .sg-sub code { font-family: var(--font-mono); font-size: 11.5px; background: var(--gray-100); padding: 1px 5px; border-radius: 4px; color: var(--gray-800); }
  .sg-sub b { color: var(--gray-900); font-weight: 600; }
  .sg-apply {
    font-size: 11px; font-weight: 500;
    padding: 5px 10px; border-radius: 6px;
    background: var(--gray-900); color: white; border: 0;
    align-self: flex-start;
  }
  .sg-apply:hover { background: var(--gray-700); }

  .rail-export {
    display: flex; align-items: center; gap: 8px;
    padding: 11px 14px;
    background: var(--accent); color: white;
    border: 0;
    border-radius: 10px;
    font-size: 13px; font-weight: 500;
    width: 100%;
    box-shadow: 0 1px 2px rgba(99,91,255,0.3);
    transition: background 140ms ease;
  }
  .rail-export:hover { background: var(--accent-hover); }
  .rail-export svg { width: 14px; height: 14px; }
  .rail-export .kbd { margin-left: auto; background: rgba(255,255,255,0.16); border-color: rgba(255,255,255,0.2); color: white; }
  .rail-export-meta { font-size: 11px; color: var(--gray-500); margin-top: 4px; line-height: 1.5; }

  /* command palette */
  .cp-overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(10, 10, 15, 0.32);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: grid; place-items: start center;
    padding-top: 14vh;
  }
  .cp {
    background: var(--gray-0);
    border-radius: 14px;
    width: 640px; max-width: 92vw;
    box-shadow: var(--shadow-xl);
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .cp-search { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border-muted); }
  .cp-search svg { width: 16px; height: 16px; color: var(--gray-400); }
  .cp-search input { flex: 1; border: none; outline: none; font-family: var(--font-sans); font-size: 15px; color: var(--gray-900); background: transparent; }
  .cp-list { padding: 8px 0; max-height: 360px; overflow-y: auto; }
  .cp-group { font-size: 11px; font-weight: 500; color: var(--gray-500); padding: 8px 16px 4px; letter-spacing: 0.02em; }
  .cp-row { display: grid; grid-template-columns: 22px 1fr auto; gap: 12px; align-items: center; padding: 8px 16px; cursor: pointer; transition: background 100ms ease; }
  .cp-row svg { width: 16px; height: 16px; color: var(--gray-500); }
  .cp-row:hover, .cp-row.sel { background: var(--gray-50); }
  .cp-row.sel { background: var(--accent-bg); }
  .cp-row.sel svg { color: var(--accent); }
  .cp-row.sel .cp-title { color: var(--indigo-700); }
  .cp-title { font-size: 13px; color: var(--gray-900); font-weight: 500; }
  .cp-sub { font-family: var(--font-mono); font-size: 11px; color: var(--gray-500); }
  .cp-kind { font-family: var(--font-mono); font-size: 10px; color: var(--gray-400); }
  .cp-foot { display: flex; gap: 18px; justify-content: flex-end; padding: 10px 16px; border-top: 1px solid var(--border-muted); background: var(--gray-50); font-size: 11px; color: var(--gray-500); }
  .cp-foot .kbd { margin-right: 4px; }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

<script type="text/babel" src="Sidebar.jsx"></script>
<script type="text/babel" src="TopBar.jsx"></script>
<script type="text/babel" src="MetricStrip.jsx"></script>
<script type="text/babel" src="ArchList.jsx"></script>
<script type="text/babel" src="TraceView.jsx"></script>
<script type="text/babel" src="InterventionRail.jsx"></script>
<script type="text/babel" src="CommandPalette.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const RUNS = [
  { id: "run_3f1", name: "support-qa · v3", ago: "now",         status: "champion" },
  { id: "run_3e8", name: "support-qa · v2", ago: "2 h ago",     status: "idle" },
  { id: "run_3a4", name: "support-qa · v1", ago: "yesterday",   status: "idle" },
  { id: "run_2b1", name: "docs-qa · sweep", ago: "2 d ago",     status: "running" },
  { id: "run_1c9", name: "billing · triage",ago: "5 d ago",     status: "failed" },
];

const ARCHITECTURES = [
  { id: "arch_b4f", name: "RAG · rerank · HyDE", shape: "retriever → reranker → tool.calc → llm → judge", f1: "0.842", cost: "$0.31", p95: "1.24s", status: "champion" },
  { id: "arch_3c1", name: "HITL · gate",         shape: "retriever → llm → hitl.review → judge",          f1: "0.851", cost: "$0.36", p95: "+ 14 m",  status: "warn" },
  { id: "arch_2e8", name: "Ensemble · judge",    shape: "ensemble[3 archs] → vote → judge",                f1: "0.838", cost: "$1.02", p95: "2.18s",  status: "warn" },
  { id: "arch_1c2", name: "RAG · single",        shape: "retriever → llm → judge",                         f1: "0.823", cost: "$0.44", p95: "1.05s",  status: "pass" },
  { id: "arch_07a", name: "Plan + act",          shape: "planner → tool* → llm → judge",                   f1: "0.811", cost: "$0.62", p95: "1.41s",  status: "fail" },
  { id: "arch_001", name: "Single-shot",         shape: "llm → judge",                                     f1: "0.804", cost: "$0.49", p95: "0.92s",  status: "baseline" },
];

const METRICS = [
  { label: "f1@k",        value: "0.842", delta: "+0.038", caption: "vs baseline · 480 cases",            spark: "0,16 12,14 24,13 36,9 48,10 60,7 72,7 84,5 96,4 108,3 120,2" },
  { label: "Cost / case", value: "$0.31", delta: "−38 %",  caption: "deterministic work moved out of LLM", spark: "0,4 12,5 24,7 36,8 48,10 60,11 72,12 84,13 96,14 108,15 120,16" },
  { label: "p95 latency", value: "1.24s", delta: "+0.32s", deltaNeg: true, caption: "reranker drives 62 %", spark: "0,12 12,11 24,9 36,7 48,8 60,5 72,4 84,5 96,4 108,3 120,2" },
  { label: "Budget used", value: "62 %",  delta: "$24.80 / $40.00", caption: "stop on cost ≤ $0.40 / case" },
];

function App() {
  const [activeRun, setActiveRun]   = useState("run_3f1");
  const [activeArch, setActiveArch] = useState("arch_b4f");
  const [paletteOpen, setPaletteOpen] = useState(false);

  useEffect(() => {
    const onKey = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
        e.preventDefault();
        setPaletteOpen(o => !o);
      }
      if (e.key === "Escape") setPaletteOpen(false);
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

  const run = RUNS.find(r => r.id === activeRun);

  return (
    <div className="app">
      <Sidebar activeRun={activeRun} runs={RUNS} onSelectRun={setActiveRun} />
      <div className="app-main">
        <TopBar run={run} onPalette={() => setPaletteOpen(true)} />
        <div className="app-content">
          <div className="app-center">
            <div className="content-head">
              <div>
                <h1 className="ch-title">support-qa · v3 <span>— champion promoted</span></h1>
                <p className="ch-sub">24 candidate architectures · 480 cases · judge: <code>gpt-4o-mini</code> · finished 14:02 UTC</p>
              </div>
              <div className="ch-actions">
                <span className="ch-pill"><span className="dot"></span>Champion · arch_b4f</span>
              </div>
            </div>

            <MetricStrip metrics={METRICS} />

            <ArchList items={ARCHITECTURES} activeId={activeArch} onSelect={setActiveArch} />

            <TraceView archId={activeArch} />
          </div>

          <InterventionRail />
        </div>
      </div>

      <CommandPalette open={paletteOpen} onClose={() => setPaletteOpen(false)} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
