[pytest]
# Ограничиваем discovery только тестами текущего проекта, чтобы не запускать внешний клонированный репозиторий.
testpaths = tests

# Явно регистрируем маркеры уровней тестирования.
markers =
    unit: Быстрые модульные тесты изолированных функций и моделей.
    integration: Интеграционные тесты взаимодействия нескольких компонентов.
    e2e: Сквозные тесты пользовательского пути через CLI/скрипты.

# Базовые опции: компактный вывод статуса с причинами пропусков/ошибок.
addopts = -ra

