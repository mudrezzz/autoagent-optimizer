site_name: AutoAgent Optimizer Wiki
site_description: User and developer documentation for AutoAgent Optimizer.
site_url: https://mudrezzz.github.io/autoagent-optimizer/
repo_url: https://github.com/mudrezzz/autoagent-optimizer
repo_name: mudrezzz/autoagent-optimizer
edit_uri: edit/master/docs/wiki/

docs_dir: docs/wiki
site_dir: site

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - pymdownx.superfences
  - pymdownx.details

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - content.code.copy

nav:
  - Home: index.md
  - User Guides:
      - Overview: user_guides/overview.md
      - C2 Candidate Selection: user_guides/c2-select-for-tests.md
      - C3 Pattern Selection: user_guides/c3-pattern-selection.md
      - C4 Dataset Studio: user_guides/c4-dataset-studio.md
      - C5s Stage Mapping: user_guides/c5s-stage-mapping.md
      - C5 Optimizer Setup: user_guides/c5-optimizer-setup.md
      - C6 Evaluators Matrix: user_guides/c6-evaluators-matrix.md
  - Developer Guides:
      - Backend: developer/backend.md
      - Frontend: developer/frontend.md
  - Releases:
      - V2.3.S4: releases/v2.3.s4.md
      - V2.3.S4a: releases/v2.3.s4a.md
      - V2.3.S5: releases/v2.3.s5.md
      - V2.3.S5a: releases/v2.3.s5a.md
      - V2.3.S6: releases/v2.3.s6.md
      - V2.3.S6a: releases/v2.3.s6a.md
      - V2.3.S7: releases/v2.3.s7.md
      - V2.4.S3: releases/v2.4.s3.md
      - V2.4.S4: releases/v2.4.s4.md
      - V2.4.S5: releases/v2.4.s5.md
      - V2.4.S5a: releases/v2.4.s5a.md
      - V2.4.S5b: releases/v2.4.s5b.md
      - V2.4.S5c: releases/v2.4.s5c.md
  - Governance:
      - ADR to Wiki Policy: governance/adr-to-wiki-policy.md
