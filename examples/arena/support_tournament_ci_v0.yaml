version: arena_v0
dataset_file: ../datasets/golden_support_v1.jsonl
execution_mode: expected_stub
task_prefix: arena-ci
budget:
  policy: equal_cases
  unit: cases
  selector: head
  limit: 0
  random_seed: 42
ranking:
  metrics:
    - name: composite_score
      direction: desc
    - name: pass_rate
      direction: desc
    - name: passed
      direction: desc
    - name: failed
      direction: asc
    - name: participant_id
      direction: asc
scoring:
  enabled: true
  normalization: minmax
  metrics:
    - name: pass_rate
      direction: desc
      weight: 0.6
    - name: rule_violations_total
      direction: asc
      weight: 0.3
    - name: duration_ms_avg
      direction: asc
      weight: 0.1
evaluator:
  mode: rule_based_v0
participants:
  - participant_id: direct_llm_candidate
    dsl_file: ../dsl/direct_llm.yaml
    stub_behavior: perfect
  - participant_id: ocr_first_candidate
    dsl_file: ../dsl/ocr_first.yaml
    stub_behavior: fail_sensitive
  - participant_id: hitl_gate_candidate
    dsl_file: ../dsl/hitl_gate.yaml
    stub_behavior: fail_all
