<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AutoAgent Optimizer · Capability Shell</title>
  <link rel="icon" href="/design_system/assets/favicon.svg" />
  <link rel="stylesheet" href="/design_system/colors_and_type.css" />
  <link rel="stylesheet" href="/frontend/styles.css" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <img src="/design_system/assets/logo-mark.svg" alt="AutoAgent Optimizer logo" />
        <div class="brand-copy">
          <div class="brand-title">AutoAgent Optimizer</div>
          <div class="brand-sub">Capability shell · V2.1.S1</div>
        </div>
      </div>
      <nav id="capability-tabs" class="capability-tabs" aria-label="Capability tabs"></nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <div class="eyebrow">Roadmap v2</div>
          <h1 class="h3">Backend + Frontend + Demo + QA</h1>
        </div>
        <div class="topbar-status">
          <span class="pill p-info"><span class="pd"></span>Frontend shell active</span>
        </div>
      </header>

      <section class="panel">
        <div id="capability-header" class="capability-header"></div>
        <div id="capability-content" class="capability-content"></div>
      </section>
    </main>
  </div>

  <script src="/frontend/app.js"></script>
</body>
</html>
